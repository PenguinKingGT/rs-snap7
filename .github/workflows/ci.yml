name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust and quality tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable doc --locked --no-deps --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        feature-args: [--no-default-features, "--features blocking", --all-features]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --all-targets ${{ matrix.feature-args }}
      - run: cargo +stable test --locked --doc ${{ matrix.feature-args }}

  features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        feature: [blocking, tag-import, server, partner, ppi, discovery, cli, demo]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked --all-targets --no-default-features --features "${{ matrix.feature }}"

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --locked --all-targets --all-features

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: python3 -m unittest discover -s tools/tests
      - run: cargo +stable package --locked --all-features
      - run: python3 tools/check_release_package.py target/package/rs-snap7-0.1.0.crate
      - run: cargo +stable publish --dry-run --locked --all-features
      - run: cargo +stable test --locked --manifest-path target/package/rs-snap7-0.1.0/Cargo.toml --all-targets --all-features
      - run: cargo +stable test --locked --manifest-path target/package/rs-snap7-0.1.0/Cargo.toml --doc --all-features
