[package]
name = "rs-snap7"
version = "0.1.0"
edition = "2024"
description = "A Rust port of python-snap7 for Siemens S7 PLC communication"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[features]
async = ["dep:tokio"]
