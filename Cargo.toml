[package]
name = "rs-snap7"
version = "0.1.0"
edition = "2024"
description = "A Rust port of python-snap7 for Siemens S7 PLC communication"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
csv = { version = "1.4.0", optional = true }
roxmltree = { version = "0.21.2", optional = true }
serde_json = { version = "1.0.154", optional = true }
serialport = { version = "4.10.1", default-features = false, optional = true }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[features]
async = ["dep:tokio"]
tag-import = ["dep:csv", "dep:serde_json", "dep:roxmltree"]
server = []
partner = []
ppi = ["dep:serialport"]
