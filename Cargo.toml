[package]
name = "rs-snap7"
version = "0.1.0"
edition = "2024"
description = "A Rust port of python-snap7 for Siemens S7 PLC communication"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
csv = { version = "1.4.0", optional = true }
ctrlc = { version = "3.5.2", optional = true }
roxmltree = { version = "0.21.2", optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.154", optional = true }
serialport = { version = "4.10.1", default-features = false, optional = true }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "network", "component"], optional = true }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[features]
async = ["dep:tokio"]
tag-import = ["dep:csv", "dep:serde_json", "dep:roxmltree", "dep:serde"]
server = []
partner = []
ppi = ["dep:serialport"]
discovery = ["dep:pnet_datalink"]
cli = ["dep:clap", "dep:ctrlc", "dep:serde_json", "server", "discovery"]
demo = ["server", "dep:sysinfo"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
pnet_datalink = { version = "0.35.0", optional = true }

[[bin]]
name = "s7"
path = "src/bin/s7.rs"
required-features = ["cli"]
